[project]
name = "yopass-api"
version = "0.0.9"
description = "This module will allow you to use Python and Yopass in automation projects"
authors = [{ name = "Sergey Ilyashevich", email = "silyashevich@gmail.com" }, { name = "Axel Rosenquist", email = "axel.rosenquist4@gmail.com" }]
requires-python = ">=3.11, < 3.13"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Axel Rosenquist", email = "axel.rosenquist4@gmail.com" }]
keywords = [
    "api",
    "cryptography",
    "yopass",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pgpy>=0.6.0,<0.7",
    "requests>=2.33.0,<3",
]

[project.urls]
Homepage = "https://github.com/silyashevich/yopass_api"
Repository = "https://github.com/silyashevich/yopass_api"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "black>=26.10.1",
    "mypy>=1.2.0,<2",
    "coverage>=7.2.3,<8",
]

[[tool.mypy.overrides]]
module = ["pgpy", "requests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = "ignore::DeprecationWarning:"

[tool.mypy-requests]
ignore_missing_imports = true
